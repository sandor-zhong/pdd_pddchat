<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>申诉运营看板</title><link rel="stylesheet" href="static/style.css"></head><body>
<header><div><h1>申诉运营看板</h1><p>订单动态 · 店铺任务 · 今日提交</p></div><span id="status">正在连接…</span><button id="logout" hidden>退出</button></header>
<form id="login" hidden><label>查看密码 <input id="password" type="password" autocomplete="current-password" required maxlength="200"></label><button>登录</button><p id="error"></p></form>
<main><p id="error-public" role="alert" hidden></p>
<nav aria-label="页面导航"><button class="tab active" data-page="overview" aria-selected="true">运行总览</button><button class="tab" data-page="statistics" aria-selected="false">今日申诉统计</button><button class="tab" data-page="diagnostics" aria-selected="false">诊断日志</button></nav>
<div class="toolbar filters"><select id="device" aria-label="电脑"><option value="">所有电脑</option></select><input id="shop" aria-label="店铺名称" placeholder="店铺名称（完整匹配）"><select id="task" aria-label="任务类型"><option value="">全部任务</option><option>负向申诉</option><option>售后申诉</option><option>发起复议</option><option>查询申诉结果</option><option>查询复议结果</option><option>查询售后结果</option><option>结果回查</option></select><button id="apply">刷新筛选</button><span>时间均为北京时间</span></div>
<section id="overview" class="page"><div class="section-heading"><div><h2>当前任务进度</h2><p>按本轮分配的店铺展示，与运行端实时同步</p></div><span class="muted">每 5 秒刷新</span></div><aside class="stop-shortcut" aria-label="停止申诉任务快捷键"><strong>停止申诉任务</strong><span><kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>F10</kbd></span><small>请在运行电脑或其远程桌面中按下；浏览器在前台也可停止。</small></aside><div id="tasks"></div>
<div class="section-heading"><div><h2>订单处理动态</h2><p id="order-scope"></p></div><label><input id="errors-only" type="checkbox">只看异常</label></div><div class="panel"><div id="orders"></div></div></section>
<section id="statistics" class="page" hidden><div class="section-heading"><div><h2>今日处理了多少条申诉</h2><p>默认按今天的实际提交时间统计各类申诉数量</p></div></div><div class="toolbar"><button id="today">今天</button><label>提交日期 <input type="date" id="start"></label><label>至 <input type="date" id="end"></label><select id="kind" aria-label="申诉类型"><option value="">全部申诉类型</option><option>负向申诉</option><option>复议</option><option>售后申诉</option></select><button id="report-refresh">查询</button></div><div id="stat-cards" class="cards"></div><div class="panel"><h2>各店铺提交情况</h2><p id="report-freshness" class="muted"></p><div id="summary" class="table-wrap"></div><p class="muted">按提交时间统计真实提交，包含结束当天；负向申诉按订单去重，复议和售后按独立记录统计。操作失败不计入真实提交。多电脑数据分别统计，跨电脑相同订单可能重复。</p></div></section>
<section id="diagnostics" class="page" hidden><div class="section-heading"><div><h2>开发诊断日志</h2><p>排查问题时查看原始日志，订单诊断也可在运行总览中下载</p></div></div><section class="toolbar"><select id="level" aria-label="日志级别"><option value="">全部级别</option><option>INFO</option><option>WARNING</option><option>ERROR</option></select><input id="q" placeholder="搜索日志内容"><button id="log-apply">筛选日志</button><button id="pause">暂停显示</button><label><input type="checkbox" id="follow" checked>自动滚动</label><button id="history">加载更早日志</button></section><div id="logs" role="log"></div></section>
</main><script src="static/app.js"></script></body></html>
